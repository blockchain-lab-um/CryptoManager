services:
    db:                                                                                                                
        image: postgres:17
        restart: unless-stopped
        environment:                                                                                                             
            POSTGRES_DB: cryptomanager
            POSTGRES_USER: cryptouser
            POSTGRES_PASSWORD: cryptopass
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app-net
        healthcheck:                                                                                                     
            test: ["CMD-SHELL", "pg_isready -U cryptouser -d cryptomanager"]
            interval: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: ./src/backend/CryptoManager.API/Dockerfile
        ports:
            - "8080:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=cryptomanager;Username=cryptouser;Password=cryptopass"
            Jwt__Secret: "dev-compose-jwt-secret-change-me-32bytes"
            DefaultAdmin__Password: "Admin123"
            HsmProviders__0__IsDefault: "true"
            HsmProviders__0__SoftHsm__FilePath: "/app/data/softhsm-keys.json"
            HsmProviders__1__Type: "SoftHsm"
            HsmProviders__1__IsDefault: "false"
            YUBIHSM_PKCS11_CONF: /etc/yubihsm_pkcs11.conf
        volumes:
            - api-data:/app/data
        expose:
            - "8080"
        networks:
            - app-net
        depends_on:
            db:
                condition: service_healthy

    frontend:
        build:
            context: ./src/frontend/crypto-manager
        ports:
            - "99:80"
        networks:
            - app-net
        depends_on:
            - api
volumes:
    pgdata:
    api-data:
    
networks:
  app-net:
    driver: bridge
