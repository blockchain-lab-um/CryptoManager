<p-dialog [visible]="visible()" (visibleChange)="visibleChange.emit($event)" [modal]="true" [draggable]="false"
    [resizable]="false" header="Revoke certificate" [style]="{ width: '36rem' }">

    @if (error(); as err) {
    <p-message severity="error" [text]="err" class="mb-4 block"></p-message>
    }

    @if (loading()) {
    <div class="flex w-full items-center justify-center py-10">
        <p-progress-spinner></p-progress-spinner>
    </div>
    } @else {
    <div class="flex flex-col gap-4" [formGroup]="form">
        <p>
            This action cannot be undone. Revoking this certificate will prevent it from being used for signing.
        </p>

        <div class="rounded border border-slate-200 p-3">
            <div class="text-xs uppercase tracking-wide text-slate-500">Certificate</div>
            <div class="mt-2 text-sm text-slate-700">{{ cert()?.subjectDN ?? 'Pending enrollment' }}</div>
            <div class="mt-1 font-mono text-xs text-slate-500">{{ cert()?.thumbprint ?? cert()?.id }}</div>
        </div>

        <div>
            <label class="text-xs text-slate-500">Reason</label>
            <p-select class="mt-1 w-full" [options]="reasonOptions" optionLabel="label" optionValue="value"
                formControlName="reason" appendTo="body"></p-select>
        </div>

        <div class="flex justify-end gap-2 pt-2">
            <button pButton type="button" label="Cancel" class="p-button-text" (click)="close()"></button>
            <button pButton type="button" label="Revoke" class="p-button-danger" (click)="submit()"></button>
        </div>
    </div>
    }
</p-dialog>
