<p-dialog [visible]="visible()" (visibleChange)="visibleChange.emit($event)" [modal]="true" [draggable]="false"
    [resizable]="false" header="Create key" [style]="{ width: '42rem' }">

    @if (error(); as err) {
    <p-message severity="error" [text]="err" class="mb-4 block"></p-message>
    }

    @if(loading()) {
    <div class="w-full h-full flex justify-center items-center">
        <p-progress-spinner></p-progress-spinner>
    </div>
    } @else {
    <div class="flex flex-col gap-4">
        <p>Are you sure you want to delete the key "{{ key()?.name }}"?</p>
        <div class="flex gap-2 justify-end">
            <button pButton label="Cancel" (click)="visibleChange.emit(false)" class="p-button-text"></button>
            <button pButton label="Delete" (click)="deleteKey()" class="p-button-danger"></button>
        </div>
    </div>
    }
</p-dialog>
