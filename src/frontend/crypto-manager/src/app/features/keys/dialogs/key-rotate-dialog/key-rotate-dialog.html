<p-dialog [visible]="visible()" (visibleChange)="visibleChange.emit($event)" [modal]="true" [draggable]="false"
    [resizable]="false" header="Rotate key" [style]="{ width: '46rem' }">

    @if (error(); as err) {
    <p-message severity="error" [text]="err" class="mb-4 block"></p-message>
    }

    @if (!rotating()) {
    <div class="text-sm text-slate-600">
        Rotating will create a new version and promote it to primary.
        <div class="mt-1 font-mono text-xs text-slate-500">{{ key()?.keyId }}</div>
    </div>

    <div class="mt-5 flex justify-end gap-2">
        <button pButton type="button" label="Cancel" class="p-button-secondary" (click)="close()"></button>
        <button pButton type="button" label="Rotate" icon="pi pi-refresh" (click)="rotate()"></button>
    </div>

    @if (rotateResult(); as res) {
    <div class="mt-5 rounded-xl border border-slate-200 bg-white p-4">
        <div class="text-xs text-slate-500">New primary version</div>
        <div class="mt-1 text-lg font-semibold">{{ res.newPrimaryVersion }}</div>

        <div class="mt-3 flex items-center justify-between">
            <div class="text-xs text-slate-500">Public key (PEM)</div>
            <div>
                <button pButton type="button" icon="pi pi-download" class="p-button-text p-button-sm"
                    aria-label="Download rotated public key" (click)="downloadRotatedKey()"></button>
                <button pButton type="button" icon="pi pi-copy" class="p-button-text p-button-sm"
                    aria-label="Copy rotated public key" (click)="copy(res.publicKeyPem)"></button>
            </div>
        </div>
        <textarea pTextarea rows="8" class="w-full mt-2 font-mono text-xs"
            [readonly]="true">{{ res.publicKeyPem }}</textarea>
    </div>
    }
    } @else {
    <div class="flex items-center justify-center py-10">
        <p-progress-spinner></p-progress-spinner>
    </div>
    }
</p-dialog>
